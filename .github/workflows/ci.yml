# PR 에서 머지 전에 자동으로 실행되는 검사 (CI). 4개 job 이 모두 통과해야 머지할 수 있다 (Ruleset)
# main 에 머지된 뒤의 빌드·검사·배포는 deploy.yml
# 액션은 태그(v1 등)가 아니라 커밋 SHA 로 고정한다. 태그는 나중에 다른 코드로 바뀔 수 있기 때문 (2026년 Trivy 사건).
name: CI

on:
  pull_request:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 기본 권한은 "읽기"만. 더 필요한 job 에서만 추가한다 (최소 권한)
permissions:
  contents: read

jobs:
  # 코드 모양·실수(Biome)와 타입 검사
  check:
    # 러너 OS 는 버전을 고정한다 (ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀜. 올릴 때는 사람이 정한다)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # package.json 의 pnpm 버전, .nvmrc 의 Node 버전을 읽어 설치하고 pnpm install 까지 한다
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm exec biome ci
      - run: pnpm typecheck
      # 인프라 코드(CDK)가 CloudFormation 템플릿으로 변환되는지 확인 (AWS 에는 접속하지 않음)
      - run: pnpm -F infra exec cdk synth --quiet -c imageTag=check
      - run: pnpm -F infra foundation synth --quiet -c githubSubjectPrefix="repo:$GITHUB_REPOSITORY"

  # 시크릿(비밀번호·토큰)이 커밋 히스토리에 들어가지 않았는지
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 전체 히스토리를 검사하기 위해
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose /repo

  # 운영과 같은 Docker 이미지를 빌드하고, 이미지 안의 알려진 취약점을 검사 (검사만. 어디에도 올리지 않는다)
  image:
    # 운영(Fargate ARM64)과 같은 CPU 의 러너에서 빌드해, 운영과 같은 종류의 이미지를 검사한다
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # 검사 결과를 Security 탭에 올리기 위해
    strategy:
      fail-fast: false
      matrix:
        app: [web, cms]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 빌드 → Trivy 검사 (단계는 .github/actions/build-image/action.yml. deploy.yml 도 같은 것을 쓴다)
      - uses: ./.github/actions/build-image
        with:
          app: ${{ matrix.app }}
          image: ${{ matrix.app }}:ci
