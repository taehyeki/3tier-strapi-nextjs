<svg viewBox="0 0 860 200" width="100%" role="img" aria-label="세 겹의 검사">
  <style>.b{fill:var(--card);stroke:var(--line);stroke-width:1.5}.a{fill:none;stroke:var(--accent,#c2410c);stroke-width:2;marker-end:url(#m5)}.t{fill:var(--fg);font-size:14px;font-weight:700}.s{fill:var(--muted);font-size:12px}</style>
  <defs><marker id="m5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#c2410c)"/></marker></defs>
  <rect class="b" x="10" y="20" width="190" height="140" rx="12"/>
  <text class="t" x="24" y="46">① 내 PC (커밋 직전)</text>
  <text class="s" x="24" y="72">lefthook</text>
  <text class="s" x="24" y="92">· 코드 모양·실수 (Biome)</text>
  <text class="s" x="24" y="112">· 시크릿 (gitleaks)</text>
  <text class="s" x="24" y="142">몇 초 · 건너뛸 수 있음</text>
  <path class="a" d="M200,90 L240,90"/>
  <rect class="b" x="240" y="20" width="190" height="140" rx="12"/>
  <text class="t" x="254" y="46">② GitHub (push 순간)</text>
  <text class="s" x="254" y="72">Push protection</text>
  <text class="s" x="254" y="92">알려진 토큰 형식이면</text>
  <text class="s" x="254" y="112">push 자체를 거부</text>
  <text class="s" x="254" y="142">GitHub 기능</text>
  <path class="a" d="M430,90 L470,90"/>
  <rect class="b" x="470" y="20" width="200" height="140" rx="12"/>
  <text class="t" x="484" y="46">③ CI (PR마다)</text>
  <text class="s" x="484" y="72">GitHub Actions</text>
  <text class="s" x="484" y="92">코드·타입·시크릿·</text>
  <text class="s" x="484" y="112">이미지 빌드·취약점</text>
  <text class="s" x="484" y="142">깨끗한 환경에서 매번</text>
  <path class="a" d="M670,90 L710,90"/>
  <rect class="b" x="710" y="20" width="140" height="140" rx="12"/>
  <text class="t" x="724" y="46">Ruleset</text>
  <text class="s" x="724" y="72">③이 전부 ✓</text>
  <text class="s" x="724" y="92">일 때만 머지</text>
  <text class="s" x="724" y="122">→ main</text>
  <text class="s" x="10" y="188">CI는 결과(✓/✗)를 표시만 합니다. "✓가 아니면 머지 금지"를 강제하는 것은 저장소 설정(Ruleset)입니다. 둘은 한 세트입니다.</text>
</svg>