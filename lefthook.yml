# git commit 직전에 자동으로 실행되는 검사 (lefthook)
# 문제가 있으면 커밋이 만들어지지 않는다. 같은 검사를 GitHub Actions(CI)에서도 한 번 더 한다.
pre-commit:
  piped: true # 위에서부터 차례로 실행한다 (타입을 만든 뒤에 그 파일도 검사하도록)
  jobs:
    # Strapi 스키마(schema.json 등)를 바꾼 커밋이면, web 이 쓰는 타입을 다시 만들어 함께 커밋한다 (pnpm gen:types 를 자동으로)
    # Strapi 를 잠깐 띄워서 만들므로 DB(pnpm dev:db)가 켜져 있어야 한다
    - name: gen-types
      glob: "apps/cms/src/**/*.json"
      run: pnpm gen:types && git add apps/web/src/types
      fail_text: "타입 생성에 실패했습니다. DB 가 켜져 있는지 확인하세요 (pnpm dev:db)"
    # 코드 모양 자동 수정 + 실수 검출. 고친 파일은 자동으로 다시 스테이징한다
    - name: biome
      glob: "*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    # 비밀번호·토큰 같은 시크릿이 커밋에 들어가지 않았는지 검사 (Docker 로 실행하므로 따로 설치할 필요 없음)
    - name: gitleaks
      run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --pre-commit --staged --redact --verbose /repo
